<title>INI-CET Rank Checker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: control strip on top, ranked list of institutes with a rank-scale bar each; second tab is a filterable allotment register */
:root{--bg:#f6f7f9;--panel:#ffffff;--fg:#18202b;--muted:#5b6676;--line:#dce1e8;--accent:#b4232c;--accent-soft:#f8e3e4;
--good:#1f7a4a;--good-soft:#dff1e7;--warn:#a26200;--warn-soft:#fbefd6;--bad:#6b7280;--bad-soft:#eceef1;--strong:#0f5c88;--strong-soft:#dcecf6;
--display:"IBM Plex Serif",Georgia,serif;--body:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151b;--panel:#181d25;--fg:#e5e9ef;--muted:#9aa4b3;--line:#2a313c;--accent:#f0656c;--accent-soft:#3a1d20;
--good:#5fcf8e;--good-soft:#173826;--warn:#e8b04a;--warn-soft:#3a2d12;--bad:#9aa4b3;--bad-soft:#252b34;--strong:#6cb8e6;--strong-soft:#15303f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151b;--panel:#181d25;--fg:#e5e9ef;--muted:#9aa4b3;--line:#2a313c;--accent:#f0656c;--accent-soft:#3a1d20;
--good:#5fcf8e;--good-soft:#173826;--warn:#e8b04a;--warn-soft:#3a2d12;--bad:#9aa4b3;--bad-soft:#252b34;--strong:#6cb8e6;--strong-soft:#15303f;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 48px;display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--display);font-size:1.9rem;line-height:1.2;margin:0 0 6px;text-wrap:balance}
header h1 span{color:var(--accent)}
header p{margin:0;color:var(--muted);max-width:65ch}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{font:inherit;font-weight:600;background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:8px 12px;cursor:pointer;margin-bottom:-1px}
.tabs button[aria-selected="true"]{color:var(--fg);border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px}
.controls label{display:flex;flex-direction:column;gap:4px;font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);min-width:0}
input,select{font:inherit;font-size:1rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;box-sizing:border-box}
#rank{font-family:var(--mono);font-size:1.15rem}
.check{flex-direction:row!important;align-items:center;gap:8px!important;text-transform:none!important;letter-spacing:0!important;font-size:.9rem!important;color:var(--fg)!important;font-weight:500!important}
.check input{width:auto}
.summary{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:.8rem;font-weight:600;white-space:nowrap}
.c-strong{background:var(--strong-soft);color:var(--strong)}
.c-good{background:var(--good-soft);color:var(--good)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:start}
.card h3{margin:0;font-size:1.05rem}
.card .meta{grid-column:1/-1;color:var(--muted);font-size:.85rem}
.rounds{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font-variant-numeric:tabular-nums}
.rounds div{background:var(--bg);border-radius:6px;padding:6px 10px;min-width:0}
.rounds small{display:block;font-size:.7rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.rounds b{font-family:var(--mono);font-weight:500}
.rounds em{font-style:normal;font-size:.75rem;color:var(--muted);display:block}
.scale{grid-column:1/-1;position:relative;height:22px;margin-top:4px}
.scale .track{position:absolute;left:0;right:0;top:10px;height:2px;background:var(--line)}
.scale .mk{position:absolute;top:4px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:var(--muted);border:2px solid var(--panel);top:5px}
.scale .mk.r1{background:var(--strong)} .scale .mk.r2{background:var(--good)} .scale .mk.r3{background:var(--warn)}
.scale .you{position:absolute;top:0;width:2px;height:22px;background:var(--accent);margin-left:-1px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.empty{background:var(--panel);border:1px dashed var(--line);border-radius:8px;padding:20px;color:var(--muted)}
.tw{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:600px;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left}
thead th{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
thead th[aria-sort="ascending"]::after{content:" ▲"} thead th[aria-sort="descending"]::after{content:" ▼"}
td.num{font-family:var(--mono);text-align:right}
th.num{text-align:right}
tbody tr:last-child td{border-bottom:0}
.count{color:var(--muted);font-size:.85rem}
.note{color:var(--muted);font-size:.85rem;max-width:70ch;margin:0}
footer{color:var(--muted);font-size:.82rem;border-top:1px solid var(--line);padding-top:14px}
footer ul{margin:6px 0;padding-left:18px}
@media (max-width:520px){.rounds{grid-template-columns:1fr 1fr 1fr}.card{grid-template-columns:1fr}.card .chip{justify-self:start}}
[hidden]{display:none!important}
.tabs{overflow-x:auto}
.tabs button{white-space:nowrap}
.cwrap{display:flex;flex-direction:column;gap:12px}
tr.click{cursor:pointer} tr.click:hover td,tr.click:hover th{background:var(--bg)}
.sec h3{font-family:var(--display);font-size:1.1rem;margin:8px 0 6px}
.op{display:block;font-size:.75rem;color:var(--muted)}
.fin{color:var(--accent);font-weight:600;text-align:right}
td.r{text-align:right;font-family:var(--mono)}
.n{font-family:var(--mono)}
.card h3 .at{font-weight:400;color:var(--muted)}
#unl-wrap{display:flex;align-items:center;gap:8px;font-size:.9rem}
#tables{flex-direction:row;flex-wrap:wrap;gap:8px}
#tables>.note,#tables>.sec,#tables>.empty{flex-basis:100%}
.blink{font:inherit;font-size:.9rem;background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer}
.blink:hover{border-color:var(--accent);color:var(--accent)}
.types{grid-column:1/-1;border:0;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 18px;min-width:0}
.types legend{font-size:.75rem;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:0;margin-bottom:6px}
.tt{font-size:.7rem;font-weight:600;letter-spacing:.04em;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px}
header{display:flex;flex-direction:column;gap:10px}
.hrow h1{margin:0}
.hrow{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:10px 16px}
.hrow h1{min-width:0}
.theme{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;background:var(--panel)}
.theme button{font:inherit;font-size:.8rem;font-weight:600;color:var(--muted);background:none;border:0;border-radius:999px;padding:4px 12px;cursor:pointer}
.theme button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.ccard{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--fg);text-decoration:none}
.ccard:hover,.ccard:focus-visible{border-color:var(--accent)}
.ccard b{font-size:1rem}.ccard span{color:var(--muted);font-size:.85rem}
.back{color:var(--accent);text-decoration:none;font-weight:600;font-size:.9rem}
.chead h2{font-family:var(--display);font-size:1.6rem;margin:4px 0 2px}
.chead p{margin:0;color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:10px}
#colview{display:flex;flex-direction:column;gap:14px}
.stat{flex:1 1 120px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.stat b{display:block;font-family:var(--mono);font-size:1.3rem;font-weight:500}
.stat span{font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.facts{display:grid;grid-template-columns:minmax(90px,140px) minmax(0,1fr);gap:0;background:var(--panel);border:1px solid var(--line);border-radius:8px;margin:0}
.facts dt,.facts dd{padding:10px 14px;border-bottom:1px solid var(--line);margin:0}
.facts dt{font-weight:600;font-size:.85rem;color:var(--muted)}
.facts dt:nth-last-of-type(1),.facts dd:last-of-type{border-bottom:0}
.ns{color:var(--warn);font-style:italic}
.srcline{font-size:.82rem;color:var(--muted);margin:0}
.srcline a,.ilink{color:var(--accent)}
.ilink{text-decoration:none}.ilink:hover{text-decoration:underline}
@media (max-width:520px){.facts{grid-template-columns:1fr}.facts dt{border-bottom:0;padding-bottom:0}}
.predlink{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;color:var(--fg);text-decoration:none}
.predlink:hover,.predlink:focus-visible{border-color:var(--accent)}
.predlink b{color:var(--accent)}.predlink span{color:var(--muted);font-size:.9rem}
</style>
